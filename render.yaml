# Render Blueprint: New > Blueprint in the Render dashboard, point it at this repo.
services:
  - type: web
    name: physics-study-api
    runtime: python
    plan: free # switch to "starter" ($7/mo) before demo day to remove cold starts
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true # redeploy on every push to main
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: LAB_ALLOW_START
        value: "1"
      - key: FRONTEND_ORIGINS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: BRIGHTDATA_API_TOKEN
        sync: false
      - key: LAB_REMOTE_URL
        sync: false

